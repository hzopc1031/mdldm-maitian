<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<title>麦田</title>
<meta name="apple-mobile-web-app-title" content="麦田">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/mt.css">

</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="page" id="app"><div class="empty" style="height:60vh">加载中…</div></div>
<script src="/static/health.js"></script>
<script src="/static/x-account-context.js"></script>
<script src="/static/mt.js"></script>
<script src="/static/publish-prep.js"></script>
<script src="/static/x-accounts-ui.js"></script>
<script>
let O = null, F = {}, timer = null, pick = null, pendingAction = null, actionError = '', libraryQuery = '', libraryPlatform = '', libraryPage = 0, calendarOffset = 0, focusedPlatform = '';
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const gainN = (p, n) => { const t = dayStr(new Date()), b = dayStr(new Date(Date.now() - n * 864e5)); return F[p] && F[p][t] != null && F[p][b] != null ? F[p][t] - F[p][b] : null; };
const latest = (p) => { const d = Object.keys(F[p] || {}).sort(); return d.length ? { day: d[d.length - 1], total: F[p][d[d.length - 1]], n: d.length } : null; };
const M = (e, p) => ((e.tasks.find(t => t.platform === p) || {}).m) || null;
const timeOf = e => e.publishedAt || e.schedule || e.observedAt || e.createdAt;
const publishedLabel=(e,at)=>e.dateOnly?`${new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'numeric',day:'numeric'}).format(new Date(at))}（仅日期）`:when(at);
const episodeLabel = e => e.episode == null ? '已导入作品' : `第 ${esc(e.episode)} 期`;
const busy = () => !!O?.commentBusy || !!O?.actions?.some(a => !a.done);
const abtn = (a, text, cls = '', cf = '') => `<button class="btn ${cls}" ${(pendingAction || busy() && !['mark','show-login','cancel-login'].includes(a.type)) ? 'disabled' : ''} data-act='${esc(JSON.stringify(a))}' data-confirm="${esc(cf)}" ${pendingAction && pendingAction.type===a.type && pendingAction.platform===a.platform ? 'aria-busy="true"' : ''}>${text}</button>`;
const collectButtons = () => ['x', 'xhs', 'wechat'].map(platform => abtn({ type: 'collect', platform }, `采集 ${PN[platform]}`)).join('');
const tile = (lab, val, sub = '') => `<div class="panel tile"><div class="lab">${lab}</div><div class="val">${val}</div><div class="dl">${sub}</div></div>`;
const sec = (t, note = '') => `<div class="sec"><h2>${t}</h2><span class="note">${note}</span></div>`;
const epc = (x) => `<span class="epc">${x.covers.length ? `<img src="/cover?id=${encodeURIComponent(x.id)}&k=${x.covers.includes('4x3') ? '4x3' : x.covers[0]}" alt="">` : '<i></i>'}<span><b>${esc(x.nick)}</b><small>${episodeLabel(x)} · ${when(timeOf(x)).split(' ')[0]}</small></span></span>`;
const samplesOf = (e) => PL.map(p => ({ name: PN[p], pts: O.samples.filter(s => s.episode_id === e.id && s.platform === p && s.views != null).map(s => [Date.parse(s.ts + ':00Z'), s.views]) })).filter(s => s.pts.length).sort((a, b) => b.pts[b.pts.length - 1][1] - a.pts[a.pts.length - 1][1]);
let after = () => {};

function vTraffic() {
  const eps = O.episodes.filter(e => e.tasks.some(t=>PL.includes(t.platform)&&t.m?.views!=null)); if (!eps.length) return `<div class="h1">数据统计</div>${accountSummaryHTML(O.accountSummaries)}<p class="lead">尚无已选平台的作品浏览数据，可到「账号与采集」更新数据。</p><div class="btns"><a class="btn" href="#/system">前往账号与采集</a></div>`;
  const all = sum(eps, 'views'), it = sum(eps, 'inter'), byP = PL.map(p => ({ p, v: eps.reduce((s, e) => s + ((M(e, p) || {}).views || 0), 0) })).sort((a, b) => b.v - a.v);
  const e = eps.find(x => x.id === pick) || eps[0], rows = PL.map(p => ({ p, m: M(e, p), t: e.tasks.find(t => t.platform === p) })).filter(r => r.m), mx = Math.max(...rows.map(r => r.m.views || 0), 1);
  after = () => { const el = $('#c-line'); if (el) drawLines(el, samplesOf(e)); };
  return `<div class="h1">数据统计</div>${accountSummaryHTML(O.accountSummaries)}<p class="lead">已保存作品的浏览与互动。日常采集按日期执行，历史累计包含不同时间的观测。</p>
  <div class="grid g4">${tile('入库作品累计浏览', fmt(all), `${eps.length} 篇作品合计`)}${tile('累计互动', fmt(it), `互动率 ${pct(it, all, 1)}`)}${tile('平均每篇浏览', fmt(all / eps.length))}${tile('播放最多的平台', PN[byP[0].p], `${fmt(byP[0].v)}，占 ${pct(byP[0].v, all)}`)}</div>
  <details class="panel traffic-all"><summary>全部作品数据明细（${eps.length} 篇）</summary><p class="note">按作品查看各平台累计浏览，查找作品可前往<a class="text-link" href="#/archive">作品库</a>。</p><div class="tw"><table><thead><tr><th>期</th>${PL.map(p => `<th class="n">${logo(p)}${PN[p]}</th>`).join('')}<th class="n">合计</th><th class="n">互动率</th></tr></thead><tbody>
    ${eps.map(x => { const m2 = Math.max(...PL.map(p => (M(x, p) || {}).views || 0), 1); return `<tr><td><a href="#/ep/${encodeURIComponent(x.id)}" title="${esc(x.name)}">${epc(x)}</a></td>${PL.map(p => { const m = M(x, p); return `<td class="n">${m ? fmt(m.views) : '–'}<span class="cellbar"><i style="width:${m ? (m.views / m2 * 100).toFixed(0) : 0}%"></i></span></td>`; }).join('')}<td class="n"><b>${fmt(x.views)}</b></td><td class="n">${pct(x.inter, x.views, 1)}</td></tr>`; }).join('')}</tbody></table></div></details>
  <div class="sec traffic-detail"><h2>${esc(e.nick)} · 各平台明细</h2>${eps.length > 1 ? `<label class="traffic-picker" for="traffic-pick">选择作品<select id="traffic-pick">${eps.map(x => `<option value="${esc(x.id)}" ${x.id === e.id ? 'selected' : ''}>${esc(x.nick)} · ${when(timeOf(x)).split(' ')[0]}</option>`).join('')}</select></label>` : ''}</div>
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">播放</th><th class="n">赞</th><th class="n">评论</th><th class="n">收藏</th><th class="n">转发</th><th class="n">互动率</th><th class="n">收藏率</th><th></th></tr></thead><tbody>
    ${rows.sort((a, b) => b.m.views - a.m.views).map(r => { const u = safeUrl(r.t && r.t.url); return `<tr><td>${logo(r.p)}${PN[r.p]}</td><td class="n"><b>${fmt(r.m.views)}</b><span class="cellbar"><i style="width:${(r.m.views / mx * 100).toFixed(0)}%"></i></span></td><td class="n">${fmt(r.m.likes)}</td><td class="n">${fmt(r.m.comments)}</td><td class="n">${fmt(r.m.favorites)}</td><td class="n">${fmt(r.m.shares)}</td><td class="n">${r.m.views ? pct(inter(r.m), r.m.views, 1) : '–'}</td><td class="n">${r.m.views && r.m.favorites != null ? pct(r.m.favorites, r.m.views, 1) : '–'}</td><td class="n">${u ? `<a href="${u}" target="_blank" rel="noopener">打开 ↗</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>
  ${sec(`${esc(e.nick)} · 播放走势`, '每次采样一个点')}<div class="panel"><div class="chartbox" id="c-line"></div></div>
  ${sec('粉丝', '每天采一次')}
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">现在</th><th class="n">今日</th><th class="n">近 7 天</th><th class="n">近 30 天</th><th class="n">已记录</th></tr></thead><tbody>
    ${PL.map(p => { const l = latest(p); const g = (n) => { const v = gainN(p, n); return v == null ? '<span style="color:var(--t3)">–</span>' : sgn(v); }; return l ? `<tr><td>${logo(p)}${PN[p]}</td><td class="n"><b>${fmt(l.total)}</b></td><td class="n">${g(1)}</td><td class="n">${g(7)}</td><td class="n">${g(30)}</td><td class="n">${l.n} 天</td></tr>` : ''; }).join('')}</tbody></table></div></div>
  <div class="btns" style="margin-top:18px"><a class="btn" href="#/system">前往账号与采集</a></div>`;
}

function vConvert() {
  const d = O.site.days, ch = O.site.channels;
  if (!d.length) return `<div class="h1">转化</div><p class="lead">还没有站点数据；L1 网页仅采集 X、小红书和公众号。</p>`;
  const l7 = d.slice(-7), p7 = d.slice(-14, -7), tr = sum(ch, 'reg') || 1, mr = Math.max(...ch.map(c => c.revenue), 1);
  after = () => { drawCols($('#c-reg'), d.map(r => ({ x: r.day.slice(5), y: r.reg || 0 }))); drawCols($('#c-rev'), d.map(r => ({ x: r.day.slice(5), y: r.revenue || 0 })), '¥'); };
  return `<div class="h1">转化</div><p class="lead">${esc(PN.zsz)}的注册、会员和收入，以及它们从哪来。</p>
  <div class="grid g4">${tile('近 7 天 · 新注册', fmt(sum(l7, 'reg')), delta(sum(l7, 'reg'), sum(p7, 'reg')))}${tile('近 7 天 · 新会员', fmt(sum(l7, 'vip')), delta(sum(l7, 'vip'), sum(p7, 'vip')))}${tile('近 7 天 · 订单', fmt(sum(l7, 'orders')), delta(sum(l7, 'orders'), sum(p7, 'orders')))}${tile('近 7 天 · 收入', '¥' + fmt(sum(l7, 'revenue')), delta(sum(l7, 'revenue'), sum(p7, 'revenue')))}</div>
  <div class="grid g2" style="margin-top:var(--gap)"><div class="panel"><div class="ph"><h3>每日新注册</h3><span class="note">近 ${d.length} 天共 ${fmt(sum(d, 'reg'))} 人</span></div><div class="chartbox" id="c-reg"></div></div>
    <div class="panel"><div class="ph"><h3>每日收入</h3><span class="note">近 ${d.length} 天共 ¥${fmt(sum(d, 'revenue'))}，${fmt(sum(d, 'orders'))} 笔</span></div><div class="chartbox" id="c-rev"></div></div></div>
  ${sec('渠道', '累计，按注册时自己填的来源')}
  <div class="panel"><div class="tw">${ch.length ? `<table><thead><tr><th>渠道</th><th class="n">注册</th><th class="n">占比</th><th class="n">会员</th><th class="n">转会员</th><th class="n">订单</th><th class="n">收入</th><th class="n">每注册收入</th></tr></thead><tbody>
    ${ch.map(c => `<tr><td>${esc(c.label || c.source)}</td><td class="n">${fmt(c.reg)}</td><td class="n">${pct(c.reg, tr)}</td><td class="n">${fmt(c.vip)}</td><td class="n">${c.reg ? pct(c.vip, c.reg, 1) : '–'}</td><td class="n">${fmt(c.orders)}</td><td class="n"><b>¥${fmt(c.revenue)}</b><span class="cellbar"><i style="width:${(c.revenue / mr * 100).toFixed(0)}%"></i></span></td><td class="n">${c.reg ? '¥' + (c.revenue / c.reg).toFixed(1) : '–'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">还没有渠道数据</div>'}</div></div>
  ${sec('每期转化漏斗', '播放 → 注册 → 会员 → 收入，按访客第一次点进来的链接归到期')}
  <div class="panel">${O.site.campaignsOn && O.site.campaigns.length ? (() => { const rows = O.site.campaigns.map(c => ({ c, e: O.episodes.find(e => e.campaign === c.campaign) })), mx = Math.max(...rows.map(r => r.e ? r.e.views : 0), 1);
      const bar = (v, m, col) => `<span class="fnl"><i style="width:${Math.max(2, v / m * 100).toFixed(1)}%;background:${col}"></i></span>`;
      return `<div class="tw"><table><thead><tr><th>期</th><th class="n">播放</th><th class="n">注册</th><th class="n">每万播放注册</th><th class="n">会员</th><th class="n">注册→会员</th><th class="n">收入</th><th class="n">每千播放收入</th></tr></thead><tbody>${rows.map(({ c, e }) => { const v = e ? e.views : 0;
        return `<tr><td>${e ? `<a href="#/ep/${encodeURIComponent(e.id)}" title="${esc(e.name)}">${epc(e)}</a>` : esc(c.campaign)}<div style="font-size:11.5px;color:var(--t3)">来自 ${esc(c.sources || '–')}</div></td><td class="n">${v ? fmt(v) : '–'}${bar(v, mx, 'var(--accent)')}</td><td class="n"><b>${fmt(c.reg)}</b></td><td class="n">${v ? (c.reg / v * 1e4).toFixed(1) : '–'}</td><td class="n">${fmt(c.vip)}</td><td class="n">${c.reg ? pct(c.vip, c.reg, 1) : '–'}</td><td class="n"><b>¥${fmt(c.revenue)}</b></td><td class="n">${v ? '¥' + (c.revenue / v * 1e3).toFixed(1) : '–'}</td></tr>`; }).join('')}</tbody></table></div>`; })()
    : `<p style="margin:0;color:var(--t2);font-size:13.5px;line-height:1.7">${O.site.campaignsOn ? '已经开始按期记录，还没有人通过视频里的链接注册。' : `现在只能看到哪个渠道带来注册和收入，看不到是哪一期带来的。让${esc(PN.zsz)}记下访客第一次带来的 <code>utm_campaign</code>，并在 dashboardApi 里返回 <code>campaignStats</code>，这里就会出现每期的转化漏斗（见 README「接入你自己的站点」）。`}</p>`}</div>
  <p class="note">此处显示本机已保存的站点数据。</p>`;
}

function vCalendar() {
  const DAY = 864e5, now = new Date(), dow = (now.getDay() + 6) % 7, mon0 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + calendarOffset*7);
  const days = Array.from({ length: 7 }, (_, i) => new Date(mon0.getTime() + i * DAY)), key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const st = (e) => { const s = e.tasks.map(t => t.state); return s.some(x => ['failed', 'not_logged_in','unknown'].includes(x)) ? ['bad', '异常 / 需核对'] : s.some(x => ['submitted','already_exists'].includes(x)) ? ['todo','已提交，待核对'] : s.some(x => x==='draft_saved') ? ['todo','已保存草稿'] : s.some(x => ['awaiting_user', 'filled'].includes(x)) ? ['todo', '等你点发布'] : s.every(x => x === 'published' || x === 'skipped') ? ['ok', '已发布'] : s.some(x => x === 'planned') ? ['plan', '计划中'] : ['sch', '已定时']; };
  const calendarTime = e => e.publishedAt || e.schedule;
  const by = {}; for (const e of O.episodes) { const at = calendarTime(e); if (!at || !Number.isFinite(Date.parse(at))) continue; const d = new Date(at); (by[key(d)] ||= []).push(e); }
  const unknown = O.episodes.filter(e => !calendarTime(e) || !Number.isFinite(Date.parse(calendarTime(e)))).length;
  const today = key(now), upcoming = O.episodes.filter(e => e.schedule && Date.parse(e.schedule) > Date.now()).length;
  return `<div class="h1">发布日历</div><p class="lead">按发布时间和排期显示本机已入库作品。${upcoming ? `接下来还有 <b>${upcoming}</b> 期要发。` : '暂无已登记的后续排期。'}</p>
  <p class="note">采集尚未覆盖完整历史；「暂无入库记录」不代表当天没有发布。${unknown ? `另有 ${unknown} 篇作品缺少发布时间，未放入日期格。` : ''}</p>
  <div class="calendar-tools"><strong>${days[0].getMonth()+1}/${days[0].getDate()} — ${days[6].getMonth()+1}/${days[6].getDate()}</strong><div class="btns"><button class="btn" data-calendar-shift="-1">上一周</button><button class="btn" data-calendar-reset>本周</button><button class="btn" data-calendar-shift="1">下一周</button></div></div>
  <div class="panel cal"><div class="cal-h">${'一二三四五六日'.split('').map(x => `<div>周${x}</div>`).join('')}</div><div class="cal-g">${days.map(d => { const k = key(d), list = by[k] || [];
    return `<div class="cal-d${k === today ? ' today' : ''}${d < new Date(now.getFullYear(), now.getMonth(), now.getDate()) ? ' past' : ''}"><div class="cal-n">${d.getDate() === 1 || d === days[0] ? `${d.getMonth() + 1}/` : ''}${d.getDate()}${k === today ? '<span>今天</span>' : ''}<small>${list.length?list.length+'篇':''}</small></div><div class="cal-items">
      ${list.length ? list.map(e => { const [c, t] = st(e), at = new Date(calendarTime(e)); return `<a class="cal-e ${c}" href="#/ep/${encodeURIComponent(e.id)}" title="${esc(e.name)}">${e.covers.length ? `<img src="/cover?id=${encodeURIComponent(e.id)}&k=${e.covers.includes('3x4') ? '3x4' : e.covers[0]}" alt="">` : ''}<div><b>${esc(e.nick)}</b><span><i></i>${e.dateOnly?'仅日期':`${pad(at.getHours())}:${pad(at.getMinutes())}`} · ${t}${e.views > 1 ? ' · ' + fmt(e.views) : ''}</span></div></a>`; }).join('') : `<p class="cal-empty">${k > today ? '暂无排期' : '暂无入库记录'}</p>`}</div></div>`; }).join('')}</div></div>
  <div class="cal-lg"><span><i class="ok"></i>已发布</span><span><i class="sch"></i>已定时</span><span><i class="todo"></i>等你点发布</span><span><i class="plan"></i>计划中</span><span><i class="bad"></i>异常</span></div>`;
}
function vArchive() {
  const filtered=O.episodes.filter(e=>(!libraryQuery||e.name.toLocaleLowerCase().includes(libraryQuery.toLocaleLowerCase()))&&(!libraryPlatform||e.tasks.some(t=>t.platform===libraryPlatform)));
  const pages=Math.max(1,Math.ceil(filtered.length/20));libraryPage=Math.max(0,Math.min(libraryPage,pages-1));
  const list=filtered.slice(libraryPage*20,libraryPage*20+20);
  return `<div class="h1">作品库</div><p class="lead">已保存 ${O.episodes.length} 篇作品，点开查看原文、平台链接与采集数据。</p>
  <form id="work-filter" class="work-filter"><label>搜索作品<input id="work-search" type="search" placeholder="输入标题关键词" value="${esc(libraryQuery)}"></label><label>平台<select id="work-platform"><option value="">全部平台</option>${(O.platforms?.map(p=>p.id)||PL).map(p=>`<option value="${p}" ${p===libraryPlatform?'selected':''}>${esc(PN[p])}</option>`).join('')}</select></label><button class="btn pri" type="submit">搜索</button><button class="btn" type="reset">重置</button></form>
  <div class="work-count note">${libraryQuery||libraryPlatform?`筛选结果 ${filtered.length} 篇`:`共 ${filtered.length} 篇`} · 第 ${libraryPage+1}/${pages} 页</div>
  <div class="panel work-list">${list.length?list.map(e=>`<a class="work-row" href="#/ep/${encodeURIComponent(e.id)}">${e.covers.length?`<img src="/cover?id=${encodeURIComponent(e.id)}&k=${e.covers.includes('4x3')?'4x3':e.covers[0]}" alt="">`:''}<div class="work-title"><h3>${esc(e.name)}</h3><p>${e.publishedAt?when(e.publishedAt):'发布时间暂无'} · ${esc(e.tasks.map(t=>PN[t.platform]||t.platform).join('、'))}</p></div><div class="work-metrics"><b>${fmt(e.views)}</b><span>累计浏览</span></div><span class="work-open">查看 ›</span></a>`).join(''):'<p class="note work-empty">没有匹配的作品，可更换关键词或重置筛选。</p>'}</div>
  <div class="work-pagination"><button class="btn" data-library-page="${libraryPage-1}" ${libraryPage===0?'disabled':''}>上一页</button><span class="note">每页20篇</span><button class="btn" data-library-page="${libraryPage+1}" ${libraryPage+1===pages?'disabled':''}>下一页</button></div>`;
}

function ageReviewPanel(tracks) {
  if (!tracks?.length) return '';
  const labels = {views:'浏览',likes:'点赞',comments:'评论'};
  const status = {pending:'还未到观察节点',missing:'窗口内未采到数据', 'unknown-date':'缺少准确发布时间'};
  const cell = (values,key) => {
    const point=values?.[key];
    return point ? `<b>${fmt(point.value)}</b> <small class="note">发布后 ${point.ageHours.toFixed(1)} 小时</small>` : '–';
  };
  return `<div class="sec age-review-head"><h2>同龄复盘</h2><span class="note">比较发布满 1、3、7 天前 6 小时内的实测。</span></div>
    <div class="panel age-review"><div class="tw"><table><thead><tr><th>平台／节点</th>${Object.values(labels).map(label=>`<th>${label}</th>`).join('')}<th>比同栏上一篇</th></tr></thead><tbody>
      ${tracks.map(track=>track.milestones.map(point=>{
        const comparison=Object.entries(point.delta).map(([key,value])=>`${labels[key]} ${sgn(value)}`).join(' · ');
        const link=track.previous?.episodeId?`<a href="#/ep/${encodeURIComponent(track.previous.episodeId)}">${esc(track.previous.title)}</a>`:esc(track.previous?.title);
        const late=Object.entries(point.late||{}).map(([key,value])=>`${labels[key]} ${fmt(value.value)}（发布后 ${value.ageHours.toFixed(1)} 小时）`).join(' · ');

});
document.addEventListener('click',async e=>{
  const button=e.target.closest('[data-age-sampling]');if(!button)return;
  button.disabled=true;
  try{
    const response=await fetch('/api/age-sampling',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:button.dataset.ageSampling==='true'})});
    if(!response.ok)throw new Error((await response.json()).error);
    await load();
  }catch(error){toast(error.message);button.disabled=false;}
});
document.addEventListener('change', (e) => { if (e.target.id === 'traffic-pick') { pick = e.target.value; render(); } });

document.addEventListener('submit',e=>{if(e.target.id!=='work-filter')return;e.preventDefault();libraryQuery=$('#work-search').value.trim();libraryPlatform=$('#work-platform').value;libraryPage=0;render();});
document.addEventListener('reset',e=>{if(e.target.id!=='work-filter')return;e.preventDefault();libraryQuery='';libraryPlatform='';libraryPage=0;render();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-library-page]');if(!b||b.disabled)return;libraryPage=Number(b.dataset.libraryPage);render();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-calendar-shift],[data-calendar-reset]');if(!b)return;calendarOffset=b.hasAttribute('data-calendar-reset')?0:calendarOffset+Number(b.dataset.calendarShift);render();});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-platform-toggle]');if(!b||b.disabled)return;actionError='';b.disabled=true;try{const r=await fetch('/api/platforms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({platform:b.dataset.platformToggle,selected:b.dataset.selected==='true'})}),j=await r.json();if(!r.ok)throw new Error(j.error);await load();}catch(error){actionError=error.message;await render();}});
document.addEventListener('submit',async e=>{const form=e.target,platform=form.dataset.platformAccount||form.dataset.nativeWork;if(!platform)return;e.preventDefault();actionError='';const button=form.querySelector('button');button.disabled=true;try{const a=form.dataset.nativeWork?{platform,title:form.elements.title.value,url:form.elements.url.value,publishedAt:new Date(form.elements.publishedAt.value).toISOString()}:{platform,account:form.elements.account.value,selected:true};const r=await fetch(form.dataset.nativeWork?'/api/native-work':'/api/platforms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(a)}),j=await r.json();if(!r.ok)throw new Error(j.error);await load();}catch(error){button.disabled=false;actionError=error.message;await render();}});

addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
addEventListener('resize', () => after());
load(); setInterval(() => { if (!location.hash.startsWith('#/prepare') && !timer && !document.hidden && !document.activeElement?.matches('input,select,textarea') && !document.querySelector('details[open]')) load(); }, 60000);
</script>
</body>
</html>
